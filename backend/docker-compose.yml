services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doananentang-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      DATABASE_URL: ${DATABASE_URL}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - '${APP_PORT}:${APP_PORT}'
    volumes:
      - .:/app
    command: >-
      sh -c "python -c \"import socket, time; host, port = 'db', 5432; print('Waiting for database to accept connections...'); s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); while s.connect_ex((host, port)) != 0: time.sleep(1); s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.settimeout(1); print('Database is ready!')\" && alembic upgrade head && uvicorn app.main:app --host ${APP_HOST} --port ${APP_PORT} --reload --reload-dir app --reload-include '.env'"

  db:
    image: postgres:16-alpine
    container_name: doananentang-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doananentang-pgadmin
    restart: always
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
